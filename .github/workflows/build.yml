name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_COMMIT: 0a875da91dbb0fdcb7ba8c42c11341aa229af51a

jobs:
  hmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: axirizon
      - uses: actions/checkout@v5
        with:
          repository: rdbtCVS/horizon
          ref: ${{ env.HORIZON_COMMIT }}
          path: horizon
          persist-credentials: false
      - name: Place the mod in the Horizon workspace
        run: |
          mkdir -p horizon/mods/axirizon
          # The whole repository, as the launcher sees it when installing from GitHub.
          cp -r axirizon/. horizon/mods/axirizon/
          sed -i 's#\.horizon/sdk/api/crates/horizon-mod-api#../../crates/horizon-mod-api#' horizon/mods/axirizon/Cargo.toml
          sed -i '0,/^members = \[/s##members = [\n    "mods/axirizon",#' horizon/Cargo.toml
      - name: Compile and test against Horizon's mod API
        working-directory: horizon
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          cargo test -p mod-axirizon
      - name: Pack the repository with Horizon's own packer
        working-directory: horizon
        run: |
          cargo build -p cargo-horizon-mod
          tool="$PWD/target/debug/cargo-horizon-mod"
          cd mods/axirizon
          "$tool" horizon-mod build
      - name: Package and check the .hmod
        run: |
          mkdir dist
          (cd axirizon && zip -r ../dist/axirizon.hmod horizon-mod.toml Cargo.toml README.md src)
          cd horizon
          cargo run -p cargo-horizon-mod -- check ../dist/axirizon.hmod
      - uses: actions/upload-artifact@v6
        with:
          name: axirizon-hmod
          path: dist/axirizon.hmod
          if-no-files-found: error
