name: SDK check

on:
  push:
    paths: [.github/workflows/sdk-check.yml]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the official Horizon repository readable anonymously?
        run: |
          curl -s -o /dev/null -w 'web: %{http_code} %{redirect_url}\n' https://github.com/horizon-rust/horizon
          GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/horizon-rust/horizon HEAD
